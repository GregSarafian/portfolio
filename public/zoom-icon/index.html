  <style>
    @font-face {
      font-family: "Open Runde";
      src: url("OpenRunde-Semibold.woff2") format("woff2");
      font-weight: 600;
      font-display: swap;
    }
    :root { --bg: #fff; --fg: #000; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #000; --fg: #fff; }
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      display: grid;
      place-items: center;
      padding: 24px 16px;
      font-family: "Open Runde", ui-rounded, -apple-system, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }
    img {
      display: block;
      width: min(140px, 35vw);
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }
    .titles {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-top: -12px;
      text-align: center;
    }
    h1 { font-size: 28px; font-weight: 600; line-height: 1.1; letter-spacing: -0.01em; }
    .titles p {
      font-size: 17px;
      font-weight: 600;
    }
    .author {
      color: color-mix(in srgb, var(--fg) 50%, transparent);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .author:hover, .author:focus-visible { color: var(--fg); }
    .author:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; border-radius: 4px; }
    .download {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 28px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--fg) 10%, transparent);
      color: var(--fg);
      font: 600 17px/1 "Open Runde", ui-rounded, -apple-system, system-ui, sans-serif;
      text-decoration: none;
      transition: transform 0.2s cubic-bezier(0.3, 0.7, 0.4, 1);
      touch-action: manipulation;
    }
    @media (hover: hover) {
      .download:hover { transform: scale(1.04); }
    }
    .download:active { transform: scale(0.94); transition-duration: 0.1s; }
    .download:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  </style>
